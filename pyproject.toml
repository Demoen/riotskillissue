[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "riotskillissue"
version = "1.1.0"
description = "Typed Python client and local MCP server for Riot Games APIs."
readme = "README.md"
license = "MIT"
authors = [{ name = "Demoen" }]
requires-python = ">=3.14,<3.17"
keywords = ["riot", "api", "mcp", "league-of-legends", "valorant", "tft", "lor"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3.16",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0,<1",
    "pydantic>=2.13.4,<3",
    "tenacity>=8.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
riotskillissue-cli = "riotskillissue.cli:main"
riotskillissue-mcp = "riotskillissue.mcp.cli:main"

[project.urls]
Homepage = "https://github.com/Demoen/riotskillissue"
Repository = "https://github.com/Demoen/riotskillissue"
Issues = "https://github.com/Demoen/riotskillissue/issues"
Changelog = "https://github.com/Demoen/riotskillissue/blob/main/CHANGELOG.md"

[project.optional-dependencies]
redis = ["redis>=5.0.0"]
tui = ["textual>=0.85.0"]
mcp = ["mcp>=2,<3"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.15.0",
    "mypy>=1.19.0",
    "jinja2>=3.1.0",
    "types-redis",
    "types-requests",
    "textual-dev>=1.0.0",
    "hatch>=1.14.0",
    "mcp[cli]>=2,<3",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/riotskillissue"]

[tool.mypy]
strict = true
ignore_missing_imports = true
python_version = "3.14"

# ── Per-module overrides for hand-written code ──
[[tool.mypy.overrides]]
module = "riotskillissue.core.types"
# StrEnum compat fallback triggers no-redef
disable_error_code = ["no-redef"]

[[tool.mypy.overrides]]
module = "riotskillissue.static"
# Cache returns Any; _fetch_map returns dynamic dicts
disable_error_code = ["no-any-return", "type-arg"]

[[tool.mypy.overrides]]
module = "riotskillissue.core.http"
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = "riotskillissue.core.client"
disable_error_code = ["type-arg", "name-defined"]

[[tool.mypy.overrides]]
module = "riotskillissue.core.sync_client"
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = "riotskillissue.cli"
# CLI functions use typer decorators; re-exports from client
disable_error_code = ["no-untyped-def", "no-untyped-call", "attr-defined"]

[[tool.mypy.overrides]]
module = "riotskillissue.testing"
disable_error_code = ["no-untyped-def"]

[[tool.mypy.overrides]]
module = "riotskillissue.tui"
# Complex TUI with dynamic Pydantic models and Textual overrides
disable_error_code = ["attr-defined", "arg-type", "type-arg", "override"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "UP006",   # Dict/List/Tuple → dict/list/tuple (keep compat style)
    "UP007",   # Union[X, Y] → X | Y
    "UP035",   # typing.Dict → dict (deprecated-import)
    "UP037",   # quoted annotations
    "UP045",   # Optional[X] → X | None
    "I001",    # import sorting (cosmetic, auto-fix can break re-exports)
]

[tool.ruff.lint.per-file-ignores]
"src/riotskillissue/__init__.py" = ["F401"]
"src/riotskillissue/testing.py" = ["F401"]
"src/riotskillissue/core/http.py" = ["F401", "UP017", "UP042"]
"src/riotskillissue/core/cache.py" = ["B027"]
"src/riotskillissue/core/client.py" = ["F821", "SIM108"]
"src/riotskillissue/core/pagination.py" = ["F401"]
"src/riotskillissue/core/ratelimit.py" = ["F401"]
"src/riotskillissue/core/types.py" = ["UP042", "UP047"]
"src/riotskillissue/core/utils.py" = ["UP047"]
"src/riotskillissue/mcp/server.py" = ["UP047"]
"src/riotskillissue/mcp/lol.py" = ["E501"]
"src/riotskillissue/models/lol/challenges_v1.py" = ["UP040"]
"src/riotskillissue/services/base.py" = ["UP017"]
"src/riotskillissue/static.py" = ["SIM108"]
"src/riotskillissue/auth.py" = ["F401"]
"src/riotskillissue/cli.py" = ["E501", "F401"]
"src/riotskillissue/tui.py" = ["E501", "F401", "F841"]
"tests/*.py" = ["F401", "B017", "E501", "E701", "B007", "F841", "SIM105"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
