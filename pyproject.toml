[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "riotskillissue"
version = "0.2.2"
description = "Production-ready, auto-updating Riot API wrapper."
readme = "README.md"
license = "MIT"
authors = [{ name = "Demoen" }]
requires-python = ">=3.10"
keywords = ["riot", "api", "league-of-legends", "valorant", "tft", "wrapper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "tenacity>=8.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
riotskillissue-cli = "riotskillissue.cli:main"

[project.urls]
Homepage = "https://github.com/Demoen/riotskillissue"
Repository = "https://github.com/Demoen/riotskillissue"
Issues = "https://github.com/Demoen/riotskillissue/issues"
Changelog = "https://github.com/Demoen/riotskillissue/blob/main/CHANGELOG.md"

[project.optional-dependencies]
redis = ["redis>=5.0.0"]
tui = ["textual>=0.85.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "jinja2>=3.1.0",
    "types-redis",
    "types-requests",
    "deepdiff>=6.0.0",
    "textual-dev>=1.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/riotskillissue"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
