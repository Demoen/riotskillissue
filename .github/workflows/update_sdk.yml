name: Update SDK

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: update-sdk
  cancel-in-progress: false

jobs:
  update-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -e ".[dev,docs,mcp,redis,tui]"

      - name: Fetch Spec & Generate Code
        id: generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/manager.py --check-upstream
          python tools/generator/core.py

      - name: Check for changes
        id: git-diff
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- spec reports src/riotskillissue/api src/riotskillissue/models docs/api-reference.md)" ]]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump Version
        id: bump
        if: steps.git-diff.outputs.changes == 'true'
        run: python tools/bump_version.py

      - name: Verify SDK
        run: |
          python tools/generator/core.py --check
          ruff check src/ tests/ tools/ examples/
          mypy src/riotskillissue/ tests/typecheck/
          pytest
          zensical build --clean --strict
          hatch build

      - name: Update Changelog
        if: steps.git-diff.outputs.changes == 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          DIFF_REPORT_PATH: ${{ steps.generate.outputs.diff_report_path }}
        run: |
          python - <<'PYEOF'
          import os
          from pathlib import Path
          from datetime import date

          version = os.environ["NEW_VERSION"]
          today = date.today().isoformat()
          report_path = os.environ.get("DIFF_REPORT_PATH", "")

          if report_path and Path(report_path).exists():
              diff_content = Path(report_path).read_text(encoding="utf-8")
              diff_content = "\n".join(
                  line for line in diff_content.splitlines()
                  if not line.startswith("# ")
              ).strip()
          else:
              diff_content = "- Synced latest Riot API spec"

          new_entry = f"## [{version}] - {today}\n\n### Changed\n\n{diff_content}\n\n"

          changelog = Path("CHANGELOG.md")
          content = changelog.read_text(encoding="utf-8")

          lines = content.split("\n")
          insert_pos = len(lines)
          for i, line in enumerate(lines):
              if line.startswith("## [") and line != "## [Unreleased]":
                  insert_pos = i
                  break

          lines.insert(insert_pos, new_entry)
          changelog.write_text("\n".join(lines), encoding="utf-8")
          print(f"Added changelog entry for v{version}")
          PYEOF

      - name: Commit and Push Changes
        if: steps.git-diff.outputs.changes == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          
          git add -A -- spec reports src/riotskillissue/api src/riotskillissue/models docs/api-reference.md pyproject.toml CHANGELOG.md
          git commit -m "feat: auto-update riot api spec to v$VERSION"
          
          echo "Tagging v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"

      - name: Dispatch Publish Workflow
        if: steps.git-diff.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "v${NEW_VERSION}"
