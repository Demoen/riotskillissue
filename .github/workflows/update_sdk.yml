name: Update SDK

on:
  schedule:
    - cron: '0 0 * * *' # Daily
  workflow_dispatch:

jobs:
  update-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -e ".[dev,docs,mcp]"

      - name: Fetch Spec & Generate Code
        id: generate
        run: |
          python tools/manager.py
          python tools/generator/core.py

      - name: Check for changes
        id: git-diff
        run: |
          git diff --exit-code || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Bump Version
        id: bump
        if: steps.git-diff.outputs.changes == 'true'
        run: python tools/bump_version.py

      - name: Verify generated release
        if: steps.git-diff.outputs.changes == 'true'
        run: |
          python tools/generator/core.py --check
          ruff check src/ tests/ tools/ examples/
          mypy src/riotskillissue/ tests/typecheck/
          pytest
          mkdocs build --strict
          hatch build

      - name: Update Changelog
        if: steps.git-diff.outputs.changes == 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          DIFF_REPORT_PATH: ${{ steps.generate.outputs.diff_report_path }}
        run: |
          python - <<'PYEOF'
          import os
          from pathlib import Path
          from datetime import date

          version = os.environ["NEW_VERSION"]
          today = date.today().isoformat()
          report_path = os.environ.get("DIFF_REPORT_PATH", "")

          if report_path and Path(report_path).exists():
              diff_content = Path(report_path).read_text(encoding="utf-8")
              # Strip the top-level "# ..." title line — CHANGELOG has its own header
              diff_content = "\n".join(
                  line for line in diff_content.splitlines()
                  if not line.startswith("# ")
              ).strip()
          else:
              diff_content = "- Synced latest Riot API spec"

          new_entry = f"## [{version}] - {today}\n\n### Changed\n\n{diff_content}\n\n"

          changelog = Path("CHANGELOG.md")
          content = changelog.read_text(encoding="utf-8")

          # Insert before the first existing version entry (## [...)
          lines = content.split("\n")
          insert_pos = len(lines)
          for i, line in enumerate(lines):
              if line.startswith("## ["):
                  insert_pos = i
                  break

          lines.insert(insert_pos, new_entry)
          changelog.write_text("\n".join(lines), encoding="utf-8")
          print(f"Added changelog entry for v{version}")
          PYEOF

      - name: Commit and Push Changes
        if: steps.git-diff.outputs.changes == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Read version from file to tag
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          
          git add src/riotskillissue/api src/riotskillissue/models pyproject.toml CHANGELOG.md
          git add -A
          git commit -m "feat: auto-update riot api spec to v$VERSION"
          git push origin main
          
          echo "Tagging v$VERSION"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        if: steps.git-diff.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          DIFF_REPORT_PATH: ${{ steps.generate.outputs.diff_report_path }}
        run: |
          if [ -f "$DIFF_REPORT_PATH" ]; then
            NOTES=$(cat "$DIFF_REPORT_PATH")
          else
            NOTES="Synced latest Riot API spec."
          fi

          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION}" \
            --notes "${NOTES}" \
            --latest
