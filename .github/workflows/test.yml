name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev,docs,mcp,redis,tui]"

      - name: Ruff
        run: ruff check src/ tests/ tools/ examples/

      - name: Mypy
        run: mypy src/riotskillissue/ tests/typecheck/

      - name: Generated code parity
        run: python tools/generator/core.py --check

      - name: Documentation
        run: zensical build --clean --strict

      - name: Package
        run: hatch build

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.14", "3.15"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python-version }}"
          allow-prereleases: true
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev,docs,mcp,redis,tui]"

      - name: Pytest
        run: pytest

  future-python:
    name: Python 3.16-dev compatibility probe
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: deadsnakes/action@v3.2.0
        with:
          python-version: "3.16-dev"

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: pip install -e ".[dev,docs,mcp,redis,tui]"

      - name: Pytest
        if: steps.install.outcome == 'success'
        run: pytest

      - name: Report unavailable dependencies
        if: steps.install.outcome == 'failure'
        run: echo "::notice title=Python 3.16 dependency support pending::The project probe could not start because an upstream dependency does not yet build on unreleased CPython 3.16."
