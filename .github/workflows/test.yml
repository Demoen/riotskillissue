name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev,docs,mcp]"

      - name: Ruff
        run: ruff check src/ tests/ tools/ examples/

      - name: Mypy
        run: mypy src/riotskillissue/ tests/typecheck/

      - name: Generated code parity
        run: python tools/generator/core.py --check

      - name: Documentation
        run: mkdocs build --strict

      - name: Package
        run: hatch build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          allow-prereleases: true
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev,docs,mcp]"

      - name: Pytest
        run: pytest

  future-python:
    name: Python 3.16-dev compatibility probe
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: deadsnakes/action@v3.2.0
        with:
          python-version: "3.16-dev"

      - name: Install dependencies
        run: pip install -e ".[dev,docs,mcp]"

      - name: Pytest
        run: pytest
