name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python-version }}"
          allow-prereleases: true
          cache: pip
      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release.py --tag "$RELEASE_TAG"
      - run: pip install -e ".[dev,docs,mcp,redis,tui]"
      - run: pytest
      - if: matrix.python-version == '3.14'
        run: |
          ruff check src/ tests/ tools/ examples/
          mypy src/riotskillissue/ tests/typecheck/
          python tools/generator/core.py --check
          zensical build --clean --strict
          hatch build

  pypi-publish:
    name: Upload release to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/riotskillissue
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build tools
        run: pip install hatch twine

      - name: Build and validate distributions
        run: |
          hatch build
          twine check --strict dist/*

      - name: Prepare reviewed release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python tools/release.py --tag "$RELEASE_TAG"
          --notes-output release-notes.md

      - name: Save release distributions and notes
        uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: |
            dist/*
            release-notes.md
          if-no-files-found: error
          overwrite: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: pypi-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download published distributions and notes
        uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release/release-notes.md
          files: |
            release/dist/*.whl
            release/dist/*.tar.gz
          fail_on_unmatched_files: true
          make_latest: true

  deploy-docs:
    name: Deploy Documentation
    needs: pypi-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install ".[docs]" "ghp-import>=2.1,<3"

      - name: Build documentation
        run: zensical build --clean --strict

      - name: Deploy to GitHub Pages
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python -m ghp_import -n -p -f -b gh-pages site
