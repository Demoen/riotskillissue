name: Publish

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python-version }}"
          allow-prereleases: true
          cache: pip
      - run: pip install -e ".[dev,docs,mcp]"
      - run: pytest
      - if: matrix.python-version == '3.14'
        run: |
          ruff check src/ tests/ tools/ examples/
          mypy src/riotskillissue/ tests/typecheck/
          python tools/generator/core.py --check
          mkdocs build --strict
          hatch build

  pypi-publish:
    name: Upload release to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/riotskillissue
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build tools
        run: pip install hatch

      - name: Build
        run: hatch build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  deploy-docs:
    name: Deploy Documentation
    needs: pypi-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install mkdocs-material mkdocs
          pip install .[docs]

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
