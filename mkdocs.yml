site_name: RiotSkillIssue
site_description: Typed Python clients and a local MCP server for Riot Games APIs
site_author: Demoen
site_url: https://demoen.github.io/riotskillissue/

repo_name: Demoen/riotskillissue
repo_url: https://github.com/Demoen/riotskillissue

theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Routing: routing.md
  - Riot Sign On: rso.md
  - MCP Server: mcp.md
  - 0.3 to 1.0 Migration: migration.md
  - Examples:
      - Overview: examples/index.md
      - League of Legends: examples/league-of-legends.md
      - Teamfight Tactics: examples/teamfight-tactics.md
      - VALORANT: examples/valorant.md
  - API Reference: api-reference.md
  - CLI: cli.md
  - Live Game TUI: live-game-tui.md
  - Contributing: CONTRIBUTING.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Demoen/riotskillissue
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/riotskillissue/

extra_css:
  - stylesheets/extra.css
