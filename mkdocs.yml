site_name: RiotSkillIssue
site_description: Typed Python clients and a local MCP server for Riot Games APIs
site_author: Demoen
site_url: https://demoen.github.io/riotskillissue/

repo_name: Demoen/riotskillissue
repo_url: https://github.com/Demoen/riotskillissue
edit_uri: edit/main/docs/

theme:
  variant: modern
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.action.view
    - content.tooltips
  icon:
    logo: lucide/gamepad-2
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - pymdownx.highlight:
      line_spans: __codelineno
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Python SDK:
      - sdk/index.md
      - Getting started: getting-started.md
      - Configuration: configuration.md
      - Routing: routing.md
      - Riot Sign On: rso.md
      - Examples:
          - examples/index.md
          - League of Legends: examples/league-of-legends.md
          - Teamfight Tactics: examples/teamfight-tactics.md
          - VALORANT: examples/valorant.md
      - Migration from 0.3: migration.md
  - Tools:
      - tools/index.md
      - MCP server: mcp.md
      - Live game TUI: live-game-tui.md
      - Command line: cli.md
  - API reference:
      - reference/index.md
      - Raw operations: api-reference.md
  - Contributing: CONTRIBUTING.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Demoen/riotskillissue
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/riotskillissue/

extra_css:
  - stylesheets/extra.css
